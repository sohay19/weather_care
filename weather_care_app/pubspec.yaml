name: weather_care
description: "Weather Care - Lifestyle-first weather app scaffold"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  firebase_analytics: ^12.6.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.6.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^20.1.0
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.3.1
  geocoding: ^5.0.0
  geolocator: 14.0.2
  http: ^1.2.1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.2
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: store/appIcon.png
  adaptive_icon_background: "#4C77A4"
  adaptive_icon_foreground: store/appIcon.png
  adaptive_icon_foreground_inset: 16
  remove_alpha_ios: true

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - config/
    - assets/data/kma_regions.json
    - assets/icons/
  fonts:
    - family: SUITE
      fonts:
        - asset: assets/fonts/SUITE-Light.ttf
          weight: 300
        - asset: assets/fonts/SUITE-Regular.ttf
          weight: 400
        - asset: assets/fonts/SUITE-Medium.ttf
          weight: 500
        - asset: assets/fonts/SUITE-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SUITE-Bold.ttf
          weight: 700
        - asset: assets/fonts/SUITE-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/SUITE-Heavy.ttf
          weight: 900
    - family: ChosunSg
      fonts:
        - asset: assets/fonts/ChosunSg.TTF
          weight: 400
    - family: Mona
      fonts:
        - asset: assets/fonts/Mona10.ttf
          weight: 400
        - asset: assets/fonts/Mona10-Bold.ttf
          weight: 700
    - family: NeoHyundai
      fonts:
        - asset: "assets/fonts/NeoHyundai L.ttf"
          weight: 300
        - asset: "assets/fonts/NeoHyundai R.ttf"
          weight: 400
        - asset: "assets/fonts/NeoHyundai B.ttf"
          weight: 700
        - asset: "assets/fonts/NeoHyundai EB.ttf"
          weight: 800
        - asset: "assets/fonts/NeoHyundai EBK.ttf"
          weight: 900
