name = "weather-care-server"
main = "src/index.ts"
compatibility_date = "2026-08-11"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "weather_care_db"
database_id = "9d1c83ca-9626-4b92-b4ea-db7433115324"

[[ratelimits]]
name = "INSTALLATION_ENROLL_LIMIT"
namespace_id = "2026091101"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "ANALYTICS_DELETION_LIMIT"
namespace_id = "2026091102"
simple = { limit = 3, period = 60 }

[vars]
APP_ORIGIN = "http://localhost:8787"
FCM_PROJECT_ID = "weather-care-2aaa8"
GA_PROPERTY_ID = "549443110"

[secrets]
required = ["KMA_SERVICE_KEY", "KMA_APIHUB_KEY", "ITS_API_KEY", "FCM_CLIENT_EMAIL", "FCM_PRIVATE_KEY", "GA_ADMIN_CLIENT_EMAIL", "GA_ADMIN_PRIVATE_KEY"]

[observability]
enabled = false

[observability.logs]
enabled = false
invocation_logs = false
persist = false

[observability.traces]
enabled = false
persist = false

[triggers]
crons = ["*/10 * * * *", "*/2 * * * *", "2-59/15 * * * *", "7-59/30 * * * *"]
