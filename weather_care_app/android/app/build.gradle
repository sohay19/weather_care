plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services' apply false
    // END: FlutterFire Configuration
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Play 설치본을 보존하는 실기기 검증용. 일반 빌드의 ID/설정은 유지한다.
def weatherCarePreview = providers.gradleProperty('weatherCarePreview').orNull == 'true'
if (!weatherCarePreview) apply plugin: 'com.google.gms.google-services'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.codesoha.weathercare"
    compileSdk = 36
    ndkVersion "29.0.13113456"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = weatherCarePreview ? "com.codesoha.weathercare.preview" : "com.codesoha.weathercare"
        manifestPlaceholders["weatherCareAppLabel"] = weatherCarePreview ? "날씨챙겨 수정본" : "날씨챙겨"
        minSdkVersion 27
        targetSdk 36
        versionCode keystoreProperties["versionCode"].toInteger()
        versionName keystoreProperties["versionName"]
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties["keyAlias"]
            keyPassword keystoreProperties["keyPassword"]
            storeFile keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
            storePassword keystoreProperties["storePassword"]
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation project(':wearBridge')
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'com.google.android.gms:play-services-ads:24.5.0'
    implementation 'androidx.work:work-runtime:2.11.2'
    testImplementation 'junit:junit:4.13.2'
}
