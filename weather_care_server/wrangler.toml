name = "weather-care-server"
main = "src/index.ts"
compatibility_date = "2026-08-11"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "weather_care_db"
database_id = "replace-with-your-d1-id"

[vars]
APP_ORIGIN = "http://localhost:8787"
FcmProject = "weather-care-dev"

[[triggers]]
crons = ["0 7 * * *", "10 5 * * *"]

