    data.grids.forEach(g=>{const o=document.createElement('option');o.value=g.id;o.textContent=`(${g.nx}, ${g.ny}) · ${g.areas.join(' / ')}`;select.append(o)});
    const zoom=d3.zoom().scaleExtent([1,24]).on('zoom',e=>{transform=e.transform;viewport.attr('transform',transform);labelLayer.attr('visibility',transform.k>4?'hidden':'visible');gridLayer.selectAll('circle').attr('r',2/transform.k)}).on('end',save);
    svg.call(zoom).on('dblclick.zoom',null);
    function save(){
      if(restoring)return;
      const host=window.openai;
      if(host&&typeof host.setWidgetState==='function') Promise.resolve(host.setWidgetState({modelContent:{selectedGrid:selected?{nx:selected.nx,ny:selected.ny,areas:selected.areas}:null},privateContent:{selectedId:selected?.id||null,zoom:{k:transform.k,x:transform.x/width,y:transform.y/height}}})).catch(()=>{});
    }
    function choose(id,persist=true){
      selected=byId.get(id)||null;select.value=selected?.id||'';
      selectedLayer.selectAll('*').remove();
      if(selected){
        selectedLayer.append('path').datum(selected.geometry).attr('class','selected-cell').attr('d',path).attr('pointer-events','none');
        detail.textContent=`(${selected.nx}, ${selected.ny}) · ${selected.areas.join(' / ')} · 중심 위도 ${selected.lat.toFixed(6)}, 경도 ${selected.lon.toFixed(6)} · 격자 내 육지 ${(selected.landFraction*100).toFixed(3)}%`;
      }else detail.textContent='격자 범위 약 5km × 5km · 기온·습도·풍속 원본 결측';
      if(persist)save();
    }
    function draw(){
      width=holder.clientWidth;height=holder.clientHeight;svg.attr('viewBox',`0 0 ${width} ${height}`);
      projection=d3.geoMercator().fitExtent([[12,20],[width-12,height-20]],data.land);
      path=d3.geoPath(projection);
      landLayer.selectAll('path').data(data.land.features).join('path').attr('class','land').attr('d',path);
      gridLayer.selectAll('path').data(data.grids).join('path').attr('class','grid-cell cursor-interaction').attr('d',g=>path(g.geometry)).attr('data-tooltip',g=>`(${g.nx}, ${g.ny}) · ${g.areas.join(' / ')}`).on('click',(e,g)=>{e.stopPropagation();choose(g.id)});
      gridLayer.selectAll('circle').data(data.grids).join('circle').attr('class','grid-center cursor-interaction').attr('cx',g=>projection([g.lon,g.lat])[0]).attr('cy',g=>projection([g.lon,g.lat])[1]).attr('r',2/transform.k).on('click',(e,g)=>{e.stopPropagation();choose(g.id)});
      labelLayer.selectAll('text').data(data.labels).join('text').attr('class','map-label text-small').attr('x',g=>projection(g.coordinates)[0]).attr('y',g=>projection(g.coordinates)[1]).attr('text-anchor','middle').text(g=>g.name);
      svg.on('click',e=>{
        if(e.defaultPrevented)return;
        const p=transform.invert(d3.pointer(e,svg.node()));
        let nearest=null,min=Infinity;
        for(const g of data.grids){const xy=projection([g.lon,g.lat]);const dist=Math.hypot(xy[0]-p[0],xy[1]-p[1]);if(dist<min){min=dist;nearest=g}}
        if(nearest&&min*transform.k<=22)choose(nearest.id);
      });
      choose(selected?.id,false);
    }
    function restore(state){
      if(!state||!state.privateContent)return;
      restoring=true;
      const s=state.privateContent;choose(s.selectedId,false);
      if(s.zoom&&Number.isFinite(s.zoom.k)&&s.zoom.k>=1&&s.zoom.k<=24&&Number.isFinite(s.zoom.x)&&Number.isFinite(s.zoom.y)) svg.call(zoom.transform,d3.zoomIdentity.translate(s.zoom.x*width,s.zoom.y*height).scale(s.zoom.k));
      restoring=false;
    }
    select.addEventListener('change',()=>choose(select.value));
    root.querySelector('[data-action="zoom-in"]').addEventListener('click',()=>svg.call(zoom.scaleBy,1.7));
    root.querySelector('[data-action="zoom-out"]').addEventListener('click',()=>svg.call(zoom.scaleBy,1/1.7));
    root.querySelector('[data-action="fit"]').addEventListener('click',()=>svg.call(zoom.transform,d3.zoomIdentity));
    draw();restore(window.openai?.widgetState);
    window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));
    new ResizeObserver(()=>draw()).observe(holder);
  })();
  </script>
</div>
